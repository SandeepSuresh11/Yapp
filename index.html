<!DOCTYPE html>
<html lang="en" style="color-scheme: dark;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Yapp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=Noto+Sans+Devanagari:wght@500;700&amp;family=Noto+Sans+Tamil:wght@500;700&amp;family=Noto+Sans+Kannada:wght@500;700&amp;family=Noto+Sans+Gujarati:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1322; --panel:#1A2138; --panel2:#222B48; --line:#2E3858; --text:#EEE7D7; --muted:#9AA3BD;
  --crimson:#D23447; --flame:#F2B544; --teal:#3FB5A6; --ink:#070A14; --c:#F2B544;
  --display:"Dela Gothic One","Arial Black",Impact,sans-serif;
  --body:"Zen Kaku Gothic New","Noto Sans Devanagari","Noto Sans Tamil","Noto Sans Kannada","Noto Sans Gujarati","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --native:"Noto Sans Devanagari","Noto Sans Tamil","Noto Sans Kannada","Noto Sans Gujarati","Zen Kaku Gothic New",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--ink)}
body{color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;overflow:hidden;user-select:none;-webkit-user-select:none}
#fx{position:fixed;inset:0;pointer-events:none;z-index:0}
.app{position:relative;z-index:1;max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;
  background:radial-gradient(120% 60% at 50% -10%,rgba(210,52,71,.22),transparent 60%),radial-gradient(90% 50% at 100% 100%,rgba(63,181,166,.14),transparent 60%),var(--bg);
  border-left:1px solid #161C30;border-right:1px solid #161C30}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 16px 24px;-webkit-overflow-scrolling:touch}
.native{font-family:var(--native)}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--flame);outline-offset:2px}

/* Brush title */
.brand{position:relative;display:inline-block;margin:0}
.brand h1{position:relative;z-index:1;font-family:var(--display);font-weight:400;font-size:1.65rem;letter-spacing:.04em;margin:0;line-height:1}
.brand svg{position:absolute;left:-10px;top:38%;width:calc(100% + 26px);height:70%;pointer-events:none}
.brand path{fill:none;stroke:var(--crimson);stroke-width:30;stroke-linecap:round;opacity:.85;stroke-dasharray:900;stroke-dashoffset:900;animation:draw 1s cubic-bezier(.7,0,.2,1) .1s forwards;filter:url(#rough)}
@keyframes draw{to{stroke-dashoffset:0}}

/* Top bar */
.top{display:flex;align-items:center;gap:8px;padding:12px 16px 8px}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:.85rem;font-weight:700;cursor:pointer;white-space:nowrap}
.chip .g{font-family:var(--native);font-size:1rem;color:var(--c)}
.stat{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:.9rem;padding:4px 8px;border-radius:10px;background:rgba(255,255,255,.04)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--crimson);color:#FFF8EC;font-weight:700;padding:13px 22px;cursor:pointer;
  clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);font-size:1rem;transition:transform .1s,filter .2s;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.teal{background:var(--teal);color:#06201D}.btn.flame{background:var(--flame);color:#231503}
.btn.ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 2px var(--line);clip-path:none;border-radius:12px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:default;filter:grayscale(.5)}
.x{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:none;cursor:pointer;font-weight:700;flex:none}

/* Cards */
.card{background:var(--panel);border:2px solid var(--line);padding:16px;margin:12px 0;clip-path:polygon(0 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%)}
.h2{font-family:var(--display);font-weight:400;font-size:1.15rem;margin:0 0 6px;letter-spacing:.02em}
.muted{color:var(--muted)}
.small{font-size:.84rem}

/* Language picker */
.langs{display:grid;gap:12px;margin-top:14px}
.lang{display:flex;align-items:center;gap:14px;text-align:left;background:var(--panel);border:2px solid var(--line);padding:14px;cursor:pointer;width:100%;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%);transition:border-color .2s,transform .15s}
.lang:active{transform:scale(.98)}
.lang .gl{width:58px;height:58px;flex:none;display:grid;place-items:center;font-family:var(--native);font-size:1.7rem;font-weight:700;color:var(--ink);background:var(--c);border-radius:50%;
  box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--c)}
.lang b{display:block;font-size:1.1rem}
.lang small{color:var(--muted)}
.lang .pbar{height:6px;background:rgba(255,255,255,.08);border-radius:6px;margin-top:6px;overflow:hidden}
.lang .pbar i{display:block;height:100%;background:var(--c)}
.lang.on{border-color:var(--c)}

/* Daily goal */
.goal{display:flex;align-items:center;gap:14px}
.ring{--p:0;width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:.85rem;
  background:conic-gradient(var(--flame) calc(var(--p)*1%),rgba(255,255,255,.08) 0)}
.ring span{width:46px;height:46px;border-radius:50%;background:var(--panel);display:grid;place-items:center}

/* Path */
.path{position:relative;padding:8px 0 10px}
.path svg.trail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.path svg.trail path{fill:none;stroke:rgba(238,231,215,.08);stroke-width:10;stroke-linecap:round;stroke-dasharray:2 18}
.node{position:relative;display:flex;flex-direction:column;align-items:center;width:150px;margin:6px 0;background:none;border:0;cursor:pointer;padding:0}
.node .seal{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:2.1rem;background:radial-gradient(circle at 35% 30%,#2B355A,var(--panel));
  border:3px solid var(--line);box-shadow:0 8px 0 #0A0E1C,0 10px 24px rgba(0,0,0,.4);transition:transform .15s}
.node:active .seal{transform:translateY(4px);box-shadow:0 4px 0 #0A0E1C}
.node.open .seal{border-color:var(--c);box-shadow:0 8px 0 #0A0E1C,0 0 26px -6px var(--c)}
.node.cur .seal{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.node.done .seal{background:radial-gradient(circle at 35% 30%,#3D2A35,#2A1E2A);border-color:var(--crimson)}
.node.locked{opacity:.42;cursor:default}
.node.locked .seal{filter:grayscale(1)}
.node .nm{margin-top:10px;font-weight:700;font-size:.9rem;text-align:center}
.pips{display:flex;gap:3px;margin-top:4px}
.pips i{width:12px;height:12px;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:rgba(255,255,255,.15)}
.pips i.on{background:var(--flame)}
.node .tag{position:absolute;top:-4px;right:20px;background:var(--teal);color:#06201D;font-size:.62rem;font-weight:700;padding:2px 6px;border-radius:6px}
.seal-stamp{position:absolute;right:16px;bottom:30px;font-family:var(--display);font-size:.6rem;color:var(--crimson);border:2px solid var(--crimson);border-radius:50%;width:34px;height:34px;display:grid;place-items:center;transform:rotate(-14deg);background:rgba(14,19,34,.85)}

/* Unit screen */
.uhead{display:flex;align-items:center;gap:12px}
.uhead .big{font-size:2.6rem}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.wcell{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;gap:8px;align-items:center;cursor:pointer;text-align:left}
.wcell .t{font-family:var(--native);font-weight:700;line-height:1.2}
.wcell small{display:block;color:var(--muted);font-size:.74rem}
.str{display:flex;gap:2px;margin-top:3px}.str i{width:10px;height:3px;border-radius:2px;background:rgba(255,255,255,.12)}.str i.on{background:var(--teal)}
.games{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.game{position:relative;text-align:left;background:var(--panel);border:2px solid var(--line);padding:12px;cursor:pointer;min-height:104px;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%)}
.game:active{transform:scale(.98)}
.game .gi{font-size:1.6rem}
.game b{display:block;margin-top:4px}
.game small{color:var(--muted);font-size:.76rem;display:block;line-height:1.3}
.game .st{position:absolute;right:10px;top:10px;width:18px;height:18px;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:rgba(255,255,255,.15)}
.game .st.on{background:var(--flame)}
.game.feature{grid-column:1/-1;border-color:var(--c);background:linear-gradient(135deg,rgba(242,181,68,.10),rgba(210,52,71,.08)),var(--panel)}
.tip{border-left:4px solid var(--teal);background:rgba(63,181,166,.08);padding:10px 12px;font-size:.9rem;margin:12px 0}

/* Game frame */
.gtop{display:flex;align-items:center;gap:10px;padding:12px 16px 6px}
.prog{flex:1;height:12px;background:rgba(255,255,255,.08);border-radius:8px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--flame));transition:width .35s}
.score{font-family:var(--display);color:var(--flame);min-width:42px;text-align:right}
.prompt{text-align:center;margin:14px 0 18px}
.prompt .q{font-size:.85rem;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.prompt .emo{font-size:3.4rem;line-height:1.1;margin:6px 0}
.prompt .main{font-size:1.9rem;font-weight:700;font-family:var(--native);line-height:1.25}
.prompt .rd{color:var(--muted);font-size:1rem;margin-top:2px}
.say{background:none;border:2px solid var(--line);border-radius:50%;width:44px;height:44px;cursor:pointer;font-size:1.2rem;margin-top:8px}
.say.big{width:96px;height:96px;font-size:2.4rem;border-color:var(--c);box-shadow:0 0 30px -8px var(--c)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:var(--panel);border:2px solid var(--line);border-bottom-width:5px;padding:14px 16px;cursor:pointer;border-radius:14px;font-size:1.1rem;font-weight:700;transition:border-color .15s}
.opt .n{font-family:var(--native)}
.opt small{display:block;font-weight:500;color:var(--muted);font-size:.8rem}
.opt:active{transform:translateY(2px);border-bottom-width:3px}
.opt.good{border-color:var(--teal);background:rgba(63,181,166,.16)}
.opt.bad{border-color:var(--crimson);background:rgba(210,52,71,.14);animation:shake .35s}
@keyframes shake{20%{transform:translateX(-7px)}60%{transform:translateX(6px)}}
.feedback{position:sticky;bottom:0;margin:16px -16px -24px;padding:14px 16px 18px;display:flex;align-items:center;gap:12px;background:var(--panel2);border-top:3px solid var(--teal);animation:rise .25s ease-out}
.feedback.bad{border-top-color:var(--crimson)}
.feedback .msg{flex:1;font-weight:700}
.feedback .msg small{display:block;font-weight:500;color:var(--muted)}
@keyframes rise{from{transform:translateY(100%)}}

/* Match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt{background:var(--panel);border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;padding:14px 8px;min-height:64px;cursor:pointer;font-weight:700;font-size:1.02rem;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity .3s,transform .3s}
.mt small{font-weight:500;color:var(--muted);font-size:.74rem}
.mt.sel{border-color:var(--flame);background:rgba(242,181,68,.12)}
.mt.gone{opacity:0;transform:scale(.85);pointer-events:none}
.mt.bad{border-color:var(--crimson);animation:shake .35s}

/* Build */
.sentence{min-height:110px;border-bottom:2px dashed var(--line);display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:10px 0 14px;margin-bottom:16px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:60px}
.tile{background:var(--panel);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:8px 12px;cursor:pointer;font-weight:700;font-family:var(--native);font-size:1.05rem;text-align:center;line-height:1.2}
.tile small{display:block;font-family:var(--body);font-weight:500;color:var(--muted);font-size:.7rem}
.tile.used{visibility:hidden}

/* Slash */
.arena{position:relative;height:min(58vh,460px);border:2px solid var(--line);overflow:hidden;border-radius:16px;
  background:radial-gradient(80% 60% at 50% 110%,rgba(210,52,71,.25),transparent 70%),repeating-linear-gradient(90deg,transparent 0 calc(33.33% - 1px),rgba(255,255,255,.04) calc(33.33% - 1px) 33.33%),#0A0F1E}
.scroll{position:absolute;bottom:-70px;width:31%;padding:10px 6px;text-align:center;cursor:pointer;font-weight:700;font-family:var(--native);font-size:1rem;line-height:1.2;
  background:linear-gradient(180deg,#F3E7C9,#E2CF9F);color:#2A1B10;border-radius:4px;box-shadow:inset 6px 0 0 #B88A4A,inset -6px 0 0 #B88A4A,0 6px 12px rgba(0,0,0,.4);animation:floatUp linear forwards}
.scroll small{display:block;font-family:var(--body);font-size:.68rem;color:#6E5434;font-weight:500}
@keyframes floatUp{to{transform:translateY(calc(-1 * min(58vh,460px) - 90px))}}
.scroll.cut{animation-play-state:paused;opacity:0;transition:opacity .25s .15s;pointer-events:none}
.scroll.wrong{animation-play-state:paused;filter:hue-rotate(-30deg) saturate(2);pointer-events:none}
.slashfx{position:absolute;pointer-events:none;width:140px;height:80px;z-index:5}
.slashfx path{fill:none;stroke:#FFF8EC;stroke-width:6;stroke-linecap:round;stroke-dasharray:200;stroke-dashoffset:200;animation:sl .3s cubic-bezier(.6,0,.2,1) forwards;filter:drop-shadow(0 0 6px var(--flame))}
@keyframes sl{60%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.target{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.target b{font-size:1.4rem}
.combo{font-family:var(--display);color:var(--flame);font-size:1rem}
.timebar{height:6px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden;margin-bottom:10px}
.timebar i{display:block;height:100%;background:var(--crimson);width:100%}

/* Results */
.result{text-align:center;padding-top:20px}
.stamp{display:inline-grid;place-items:center;width:150px;height:150px;border-radius:50%;border:6px solid var(--crimson);color:var(--crimson);font-family:var(--display);font-size:1.8rem;transform:rotate(-12deg);
  margin:10px auto 6px;animation:stamp .5s cubic-bezier(.2,1.6,.4,1);filter:url(#rough2);background:rgba(210,52,71,.06)}
.stamp.retry{border-color:var(--muted);color:var(--muted)}
@keyframes stamp{from{transform:rotate(-12deg) scale(2.4);opacity:0}}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.rgrid div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 4px}
.rgrid b{display:block;font-family:var(--display);font-size:1.3rem;color:var(--flame)}
.rgrid small{color:var(--muted);font-size:.74rem}
.result .row{display:grid;gap:10px}

/* Learn cards */
.flash{perspective:900px;height:330px;margin:10px 0 16px}
.flash .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.flash.flip .in{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--panel);border:2px solid var(--c);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.flash .back{transform:rotateY(180deg);background:linear-gradient(160deg,var(--panel2),var(--panel))}
.flash .face .main{font-size:2.3rem;font-weight:700;font-family:var(--native);line-height:1.2}
.flash .hint{position:absolute;bottom:12px;font-size:.76rem;color:var(--muted)}

/* Review / me */
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:110px 1fr 36px;gap:8px;align-items:center;font-size:.85rem}
.bar .b{height:10px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}.bar .b i{display:block;height:100%;background:var(--teal)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.sw{position:relative;width:52px;height:30px;border-radius:999px;background:var(--line);border:0;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;left:4px;top:4px;width:22px;height:22px;border-radius:50%;background:var(--text);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--teal)}.sw[aria-checked="true"]::after{transform:translateX(22px)}

/* Chat */
.chatlog{display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.bub{max-width:88%;padding:10px 12px;border-radius:16px;font-size:.98rem;line-height:1.4}
.bub.me{align-self:flex-end;background:var(--crimson);color:#FFF8EC;border-bottom-right-radius:4px}
.bub.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub .tl{font-family:var(--native);font-weight:700;font-size:1.08rem}
.bub .rl{color:var(--flame);font-size:.88rem}
.bub .el{color:var(--muted);font-size:.86rem;font-style:italic}
.bub .cl{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);font-size:.86rem;color:#BFEDE6}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chips button{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:.84rem;cursor:pointer;white-space:nowrap}
.compose{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--line);background:var(--bg)}
.compose input{flex:1;min-width:0;background:var(--panel);border:2px solid var(--line);border-radius:14px;color:var(--text);padding:12px 14px;font:inherit;user-select:text;-webkit-user-select:text}
input,textarea{user-select:text;-webkit-user-select:text}
.field{width:100%;background:var(--panel2);border:2px solid var(--line);border-radius:12px;color:var(--text);padding:12px 14px;font:inherit}

/* Bottom nav */
nav{display:flex;border-top:2px solid var(--line);background:#0B1020;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;padding:6px 0;cursor:pointer;color:var(--muted);font-size:.7rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px}
nav button span{font-size:1.35rem;line-height:1}
nav button[aria-current="page"]{color:var(--text);background:rgba(210,52,71,.16)}
.toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-160%);background:var(--text);color:var(--ink);padding:10px 16px;border-radius:999px;font-weight:700;z-index:50;transition:transform .3s cubic-bezier(.2,1.4,.4,1),visibility .3s;max-width:90vw;text-align:center;visibility:hidden}
.toast.show{transform:translate(-50%,0);visibility:visible}
.xpfly{position:fixed;z-index:40;font-family:var(--display);color:var(--flame);pointer-events:none;animation:xpf .9s ease-out forwards;font-size:1.1rem}
@keyframes xpf{to{transform:translateY(-60px);opacity:0}}
.ink{position:fixed;pointer-events:none;z-index:39;border-radius:50%;animation:inkp .6s ease-out forwards}
@keyframes inkp{from{transform:scale(.2);opacity:.9}to{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0E1322">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Yapp">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>window.WB_STANDALONE = true;</script>
</head>
<body>

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[(Math.random() * a.length) | 0];
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
let toastT; function toast(t){ $('toast').textContent = t; $('toast').classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => $('toast').classList.remove('show'), 2400); }

/* ================= State & saving ================= */
const STAR_GAMES = ['pick', 'match', 'build', 'slash', 'spell'];
let P = {v: 1, cur: null, xp: 0, streak: {last: null, n: 0}, daily: {date: null, n: 0}, goal: 3, settings: {reading: true, sfx: true, auto: true}, langs: {}};
try { const l = JSON.parse(localStorage.getItem('wordblade') || 'null'); if (l && l.v === 1) P = Object.assign(P, l); } catch (e) {}
const LP = () => (P.langs[P.cur] ||= {stars: {}, learned: {}, words: {}, custom: []});
let ref = null, writing = false, pending = false, saveT = null;
function dirty(){ clearTimeout(saveT); saveT = setTimeout(save, 700); }
async function save(){
  try { localStorage.setItem('wordblade', JSON.stringify(P)); } catch (e) {}
  if (!ref) return;
  if (writing){ pending = true; return; }
  writing = true;
  try { await ref.set(JSON.parse(JSON.stringify(P))); }
  catch (e) { if (e && ['invalid_argument', 'revoked', 'not_granted'].includes(e.code)) ref = null; }
  writing = false; if (pending){ pending = false; save(); }
}
let sample = null, ttsCap = null, storeKind = 'browser';
async function initClaude(){
  if (!window.claude || typeof window.claude.use !== 'function') return;
  const [db, user, smp, tts] = await Promise.all(['db', 'user', 'sample', 'tts'].map(n => window.claude.use(n).catch(() => null)));
  sample = smp || null; ttsCap = tts || null;
  try {
    const uid = user ? await user.id() : null;
    if (db && uid){
      const r = db.doc('data/users/' + uid + '/wordblade');
      const snap = await Promise.race([r.get(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 10000))]);
      if (snap.exists){
        const d = JSON.parse(JSON.stringify(snap.data() || {}));
        if (d.v === 1 && (d.xp || 0) >= (P.xp || 0)) P = Object.assign(P, d);
      }
      ref = r; storeKind = 'account'; if (!snap.exists && P.cur) save();
    }
  } catch (e) {}
  rerender();
}
function award(xp){
  P.xp += xp;
  const t = today();
  if (P.daily.date !== t) P.daily = {date: t, n: 0};
  if (P.streak.last !== t){ const y = new Date(); y.setDate(y.getDate() - 1); const ys = y.getFullYear() + '-' + String(y.getMonth() + 1).padStart(2, '0') + '-' + String(y.getDate()).padStart(2, '0'); P.streak = {last: t, n: P.streak.last === ys ? P.streak.n + 1 : 1}; }
  dirty();
}

/* ================= Content helpers ================= */
const L = () => LANGS[P.cur];
function units(){
  const lg = L();
  const base = UNITS.map((u, i) => ({id: u.id, name: u.name, icon: u.icon, tip: lg.tips[u.id], idx: i,
    items: u.words.map(([en, emoji], j) => ({key: u.id + ':' + j, en, emoji, w: lg.units[i][j].w, r: lg.units[i][j].r, unit: u.id})),
    sents: lg.sent[i].map((s, j) => ({...s, en: SENT_EN[i][j]}))}));
  return base.concat((LP().custom || []).map((c, k) => ({...c, custom: true, idx: base.length + k})));
}
const unitById = id => units().find(u => u.id === id);
const starsOf = u => STAR_GAMES.filter(g => LP().stars[u.id]?.[g]).length;
const unlocked = (u, list = units()) => u.custom || u.idx === 0 || starsOf(list[u.idx - 1]) >= 2;
const showRd = () => L().script !== 'latin' && P.settings.reading;
const rdHTML = (r, cls = 'rd') => r && showRd() ? `<div class="${cls}">${esc(r)}</div>` : '';
const strength = it => LP().words[it.key]?.s || 0;
function mark(it, ok){ const W = LP().words; const s = W[it.key] ||= {s: 0, n: 0}; s.s = ok ? Math.min(5, s.s + 1) : Math.max(0, s.s - 1); s.n++; s.t = Date.now(); dirty(); }
function learnedItems(){ const lp = LP(); return units().filter(u => lp.learned[u.id] || starsOf(u) > 0).flatMap(u => u.items); }
function graphemes(s){
  if (window.Intl && Intl.Segmenter) return [...new Intl.Segmenter(undefined, {granularity: 'grapheme'}).segment(s)].map(x => x.segment);
  const out = []; for (const m of s.match(/\P{M}\p{M}*/gu) || []){ if (out.length && /[्்್]$/.test(out[out.length - 1])) out[out.length - 1] += m; else out.push(m); } return out;
}
const ARTICLE = /^(el|la|los|las|le|les|un|une)\s+|^l['’]/i;

/* ================= Speech & sound ================= */
let voices = [];
function loadVoices(){ try { voices = speechSynthesis.getVoices() || []; } catch (e) { voices = []; } }
if ('speechSynthesis' in window){ loadVoices(); try { speechSynthesis.onvoiceschanged = () => { loadVoices(); if (view.tab === 'me' || view.screen === 'unit') rerender(); }; } catch (e) {} }
const voiceFor = code => { const p = code.split('-')[0].toLowerCase(); const norm = v => (v.lang || '').toLowerCase().replace('_', '-'); return voices.find(v => norm(v) === code.toLowerCase()) || voices.find(v => norm(v).startsWith(p + '-') || norm(v) === p || (p === 'zh' && (norm(v).startsWith('cmn') || norm(v).startsWith('zh-hans')))) ; };
const RNAME = {jpan: 'romaji', hans: 'pinyin with tone marks', kore: 'Revised Romanization'};
const readingName = lg => RNAME[lg.script] || 'simple English-letter romanization, doubling long vowels (e.g. paani)';
const canSpeak = () => !!voiceFor(L().code) || !!ttsCap;
async function speak(text){
  const lg = L(), v = voiceFor(lg.code);
  if (v){ try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.voice = v; u.lang = v.lang; u.rate = .82; speechSynthesis.speak(u); return; } catch (e) {} }
  if (ttsCap){ try { await ttsCap.speak(text, {language: lg.code, rate: .85}); return; } catch (e) { if (e && e.code === 'not_granted') ttsCap = null; if (e && e.code !== 'viewer_stopped') toast('Couldn’t play audio just now'); return; } }
  toast(`No ${lg.name} voice on this device`);
}
let actx;
function tone(fs, type = 'sine', d = .1, vol = .07){
  if (!P.settings.sfx) return;
  try { actx ||= new (window.AudioContext || window.webkitAudioContext)(); const t0 = actx.currentTime;
    fs.forEach((f, i) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, t0 + i * d); g.gain.exponentialRampToValueAtTime(.0001, t0 + i * d + d * 1.8); o.connect(g).connect(actx.destination); o.start(t0 + i * d); o.stop(t0 + i * d + d * 2); }); } catch (e) {}
}
const sfx = {good: () => tone([660, 990]), bad: () => tone([200, 150], 'square', .13, .04), slash: () => tone([1500, 600], 'sawtooth', .04, .035), stamp: () => tone([120, 80], 'triangle', .16, .16), win: () => tone([523, 659, 784, 1046], 'sine', .09, .06)};
function xpFly(el, txt){ if (!el || reduced) return; const r = el.getBoundingClientRect(); const d = document.createElement('div'); d.className = 'xpfly'; d.textContent = txt; d.style.left = (r.left + r.width / 2 - 14) + 'px'; d.style.top = (r.top) + 'px'; document.body.appendChild(d); setTimeout(() => d.remove(), 900); }
function inkPop(el, color){ if (!el || reduced) return; const r = el.getBoundingClientRect(); const d = document.createElement('div'); d.className = 'ink'; const s = 60; d.style.cssText = `left:${r.left + r.width / 2 - s / 2}px;top:${r.top + r.height / 2 - s / 2}px;width:${s}px;height:${s}px;background:radial-gradient(circle,${color} 0 40%,transparent 70%)`; document.body.appendChild(d); setTimeout(() => d.remove(), 650); }

/* ================= Chrome ================= */
let view = {tab: 'path', screen: 'path', unit: null};
function setChrome(game){ $('top').hidden = game; $('nav').hidden = game; if (game) $('compose').hidden = true; }

    <div class="chips" id="topics">${['Weather', 'Body', 'Clothes', 'Days of the week', 'Feelings', 'Shopping', 'At work', 'Kitchen', 'Festivals'].map(t => `<button type="button">${t}</button>`).join('')}</div>

function drawTrail(){
  const svg = $('trail'), box = $('path'); if (!svg || !box) return;
  const br = box.getBoundingClientRect();
  const pts = [...box.querySelectorAll('.seal')].map(s => { const r = s.getBoundingClientRect(); return [r.left - br.left + r.width / 2, r.top - br.top + r.height / 2]; });
  if (pts.length < 2) return;
  let d = `M${pts[0][0]} ${pts[0][1]}`; for (let i = 1; i < pts.length; i++){ const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], my = (y0 + y1) / 2; d += ` C${x0} ${my},${x1} ${my},${x1} ${y1}`; }
  svg.setAttribute('viewBox', `0 0 ${br.width} ${br.height}`); svg.innerHTML = `<path d="${d}"/>`;
}
addEventListener('resize', () => { if (view.screen === 'path') drawTrail(); });

/* ================= Game engine ================= */
let G = null;
function startGame(kind, unit, opts = {}){
  stopGame();
  G = {kind, unit, i: 0, correct: 0, wrong: 0, timers: [], ...opts};
  setChrome(true); main.scrollTop = 0;
  try { actx?.resume?.(); } catch (e) {}
  GAMES[kind].start();
}
function stopGame(){ if (!G) return; G.timers.forEach(t => { clearTimeout(t); clearInterval(t); }); if (G.raf) cancelAnimationFrame(G.raf); try { speechSynthesis.cancel(); } catch (e) {} G = null; }
function frame(pct, inner){
  main.innerHTML = `<div class="gtop" style="padding:0 0 8px"><button class="x" id="gx" type="button" aria-label="Quit game">✕</button><div class="prog"><i id="gprog" style="width:${pct}%"></i></div><span class="score" id="gscore">${G.correct}</span></div><div id="gb">${inner}</div>`;
  $('gx').onclick = () => { const back = G?.unit ? ['unit', {screen: 'unit', unit: G.unit.id}] : [view.tab === 'review' ? 'review' : 'path']; stopGame(); go(...back); };
}
function setProg(p){ const e = $('gprog'); if (e) e.style.width = p + '%'; const s = $('gscore'); if (s && G) s.textContent = G.correct; }
function feedback(ok, it, extra = '', onNext){
  const fb = document.createElement('div'); fb.className = 'feedback' + (ok ? '' : ' bad');
  fb.innerHTML = `<span style="font-size:1.6rem">${ok ? '✨' : '✏️'}</span><div class="msg">${ok ? pick(['Nice!', 'Correct!', 'Sharp!', 'Clean cut!', 'Great!']) : 'Correct answer:'}<small>${extra || (it ? `<span class="native">${esc(it.w)}</span>${showRd() && it.r ? ' · ' + esc(it.r) : ''} = ${esc(it.en)}` : '')}</small></div>${it && canSpeak() ? '<button class="say" type="button" id="fbSay" aria-label="Hear it">🔊</button>' : ''}<button class="btn ${ok ? 'teal' : ''}" type="button" id="fbNext">Continue</button>`;
  $('gb').appendChild(fb);
  if (it && canSpeak()){ $('fbSay').onclick = () => speak(it.w); if (P.settings.auto && voiceFor(L().code)) speak(it.w); }
  $('fbNext').onclick = onNext; $('fbNext').focus({preventScroll: true});
  fb.scrollIntoView({block: 'end', behavior: reduced ? 'auto' : 'smooth'});
}
function answer(ok, it, el){
  if (it) mark(it, ok);
  if (ok){ G.correct++; sfx.good(); xpFly(el, '+2'); inkPop(el, 'rgba(63,181,166,.6)'); } else { G.wrong++; sfx.bad(); inkPop(el, 'rgba(210,52,71,.55)'); }
  setProg(G.prog ? G.prog() : 0);
}
function finish(){
  const g = G, acc = g.correct + g.wrong ? g.correct / (g.correct + g.wrong) : 0;
  const pass = g.kind === 'slash' ? g.correct >= 6 && acc >= .7 : g.kind === 'learn' ? true : acc >= .8;
  let xp = g.correct * 2 + (pass ? 10 : 0), star = false;
  if (g.unit){
    const lp = LP();
    if (g.kind === 'learn') lp.learned[g.unit.id] = true;
    if (pass && STAR_GAMES.includes(g.kind) && !lp.stars[g.unit.id]?.[g.kind]){ (lp.stars[g.unit.id] ||= {})[g.kind] = 1; star = true; xp += 15; }
  }
  if (g.kind === 'learn') xp = 5;
  award(xp);
  P.daily.n = (P.daily.date === today() ? P.daily.n : 0) + 1; P.daily.date = today(); dirty();
  const unitStars = g.unit ? starsOf(g.unit) : 0;
  const nextUnlocked = star && g.unit && !g.unit.custom && unitStars === 2 && units()[g.unit.idx + 1];
  stopGame(); G = null;
  const nextGame = g.unit ? STAR_GAMES.find(k => !LP().stars[g.unit.id]?.[k] && k !== g.kind) : null;
  main.innerHTML = `<div class="result">
    <div class="stamp ${pass ? '' : 'retry'}">${g.kind === 'learn' ? 'READY' : pass ? 'PASS' : 'AGAIN'}</div>
    <p class="h2" style="margin-top:8px">${g.kind === 'learn' ? 'Words learned. Time to play!' : pass ? (star ? 'You earned a star! ★' : 'Well played!') : 'Almost! Try once more.'}</p>
    ${nextUnlocked ? `<p class="muted">🔓 New unit unlocked: <b>${esc(nextUnlocked.name)}</b></p>` : ''}
    ${g.kind !== 'learn' ? `<div class="rgrid"><div><b>${g.correct}</b><small>correct</small></div><div><b>${Math.round(acc * 100)}%</b><small>accuracy</small></div><div><b>+${xp}</b><small>XP</small></div></div>` : `<div class="rgrid"><div><b>${g.unit.items.length}</b><small>words</small></div><div><b>${P.streak.n}</b><small>day streak</small></div><div><b>+${xp}</b><small>XP</small></div></div>`}
    <div class="row">

  const sys = `You are a warm, patient conversation partner helping an adult beginner practise ${lg.name}. Scenario: ${scenario}.
Words the learner has studied: ${known}.
Use mostly those words and other very common beginner words. Keep each turn to 1 or 2 short, simple sentences and end with an easy question so the conversation keeps going.
The learner may write in ${lg.name}${lg.script !== 'latin' ? ', in English-letter romanization,' : ''} or in English. If they write in English, show them how to say it in ${lg.name}.
Reply in exactly this format, each part on its own line, nothing else:
TL: <your reply in ${lg.name}${lg.script !== 'latin' ? ' script' : ''}>
${lg.script !== 'latin' ? `RD: <the same reply in ${readingName(lg)}>\n` : ''}EN: <English translation>
FIX: <the correct ${lg.name} for the learner's last message if it had a mistake or was in English${lg.script !== 'latin' ? ', with romanization in brackets' : ''}; otherwise leave empty>`;
  const msgs = log.slice(0, -1).slice(-12).map(m => ({role: m.role, content: m.text}));
  msgs[msgs.length - 1] = {role: 'user', content: sys + '\n\nLearner says: ' + text};
  while (msgs.length && msgs[0].role !== 'user') msgs.shift();
  try {
    const r = await sample(msgs, {modelTier: 'default', cache: false, onText: ({text: t}) => { log[log.length - 1].text = t; const el = $('log'); if (el && view.screen === 'chat') { el.lastElementChild.outerHTML = bubble(log[log.length - 1]); main.scrollTop = main.scrollHeight; } }});
    log[log.length - 1].text = (r && r.text) || log[log.length - 1].text;
    award(3);
  } catch (e) {
    if (e && e.code === 'not_granted') sample = null;
    log[log.length - 1].text = e && e.code === 'rate_limited' ? 'Claude is busy. Try again in a minute.' : 'Claude couldn’t answer just now.';
  }
  if (view.screen === 'chat') renderChat();
}

/* ================= New unit with Claude ================= */
async function makeUnit(topic){
  const lg = L(), st = $('mkState'); if (!sample) return;
  if ((LP().custom || []).length >= 12){ toast('Remove a Claude unit to make room (max 12)'); return; }
  main.querySelectorAll('#topics button, #mk').forEach(b => b.disabled = true); st.textContent = `✦ Claude is writing a “${topic}” unit…`;
  const latin = lg.script === 'latin';
  const prompt = `Create a beginner vocabulary unit for an adult learning ${lg.name}, on the topic "${topic}".
Reply with JSON only, matching exactly:
{"name": "short unit name in English", "icon": "one emoji", "tip": "one short, accurate grammar or culture tip in English",
 "words": [8 items like {"en": "English meaning", "emoji": "one emoji or empty string", "w": "the ${lg.name} word${latin ? ' (nouns with their definite article)' : ' in native script'}", "r": "${latin ? '' : readingName(lg)}"}],
 "sentences": [2 items like {"en": "simple English sentence", "t": "the ${lg.name} sentence with punctuation", "tk": ["the sentence split into word tiles in order, no punctuation"], "r": ${latin ? 'null' : '["romanization of each tile, same length as tk"]'}}]}
Rules: exactly 8 common everyday words with no duplicates; standard, natural ${lg.name}${lg.code === 'hi-IN' ? ' (Devanagari)' : ''}; sentences use mostly the unit's words; tk joined with spaces must equal t without punctuation.`;
  let err = '';
  for (let a = 0; a < 2; a++){
    try {
      const r = await sample(a ? prompt + `\n\nYour last answer was invalid: ${err}. Fix it.` : prompt, {modelTier: 'default', cache: false});
      const t = r.text || '', j = JSON.parse(t.slice(t.indexOf('{'), t.lastIndexOf('}') + 1));
      const words = (j.words || []).filter(w => w && w.w && w.en).slice(0, 8);
      if (words.length < 8) throw new Error('needs 8 words');
      if (new Set(words.map(w => w.w)).size < 8) throw new Error('duplicate words');
      const sents = (j.sentences || []).filter(s => s && s.t && Array.isArray(s.tk) && s.tk.length).slice(0, 2);
      if (sents.length < 2) throw new Error('needs 2 sentences with tk arrays');
      const id = 'c' + Date.now().toString(36);
      const unit = {id, name: String(j.name || topic).slice(0, 30), icon: String(j.icon || '✦').slice(0, 4), tip: String(j.tip || ''),
        items: words.map((w, i) => ({key: id + ':' + i, en: String(w.en), emoji: String(w.emoji || '').slice(0, 4), w: String(w.w), r: latin ? '' : String(w.r || ''), unit: id})),
        sents: sents.map(s => ({en: String(s.en || ''), t: String(s.t), tk: s.tk.map(String), r: !latin && Array.isArray(s.r) && s.r.length === s.tk.length ? s.r.map(String) : null}))};
      (LP().custom ||= []).push(unit); dirty(); toast(`✦ “${unit.name}” added to your path`); go('unit', {screen: 'unit', unit: id}); return;
    } catch (e) { if (e && e.code){ st.textContent = e.code === 'rate_limited' ? 'Claude is busy. Try again in a minute.' : 'Claude couldn’t make a unit just now.'; break; } err = e.message || 'invalid JSON'; }
  }
  if (st && !st.textContent.startsWith('Claude')) st.textContent = 'That didn’t work twice. Try another topic.';
  main.querySelectorAll('#topics button, #mk').forEach(b => b.disabled = false);
}

/* ================= Me ================= */
function renderMe(){
  const lg = L(), v = voiceFor(lg.code), lp = LP();
  const words = Object.values(lp.words).filter(w => w.s >= 4).length, stars = units().reduce((s, u) => s + starsOf(u), 0);
  const sw = (k, label, sub) => `<div class="toggle"><div><b>${label}</b><div class="muted small">${sub}</div></div><button class="sw" type="button" role="switch" aria-checked="${!!P.settings[k]}" data-k="${k}" aria-label="${label}"></button></div>`;
  main.innerHTML = `<div class="card"><p class="h2">Your ${esc(lg.name)}</p><div class="rgrid" style="margin:10px 0 0"><div><b>${P.xp}</b><small>XP (all languages)</small></div><div><b>${stars}</b><small>stars</small></div><div><b>${words}</b><small>words mastered</small></div></div></div>
  <div class="card"><p class="h2">Settings</p>
    ${lg.script !== 'latin' ? sw('reading', 'Show English-letter readings', 'Turn off when you can read the script') : ''}
    ${sw('auto', 'Auto-play pronunciation', 'Speak words when they appear or after you answer')}
    ${sw('sfx', 'Sound effects', 'Chimes, slashes and stamps')}
    <div class="toggle"><div><b>Daily goal</b><div class="muted small">Games per day</div></div><div style="display:flex;gap:6px">${[2, 3, 5].map(n => `<button class="chip" type="button" data-goal="${n}" ${P.goal === n ? 'style="border-color:var(--c);color:var(--c)"' : ''}>${n}</button>`).join('')}</div></div>
  </div>
  <div class="card"><p class="h2">Voice</p><p class="muted small" style="margin:0">${v ? `✓ Using “${esc(v.name)}” for ${esc(lg.name)}.` : ttsCap ? `✓ Using Claude’s voice for ${esc(lg.name)}.` : `✗ This device has no ${esc(lg.name)} voice, so the 🔊 buttons and the Listen game are hidden. Many phones let you download extra voices in their accessibility or speech settings; reopen this page afterwards.`}</p>
  ${v || ttsCap ? `<p style="margin:10px 0 0"><button class="btn ghost" type="button" id="test">🔊 Test: <span class="native">${esc(lg.units[0][0].w)}</span></button></p>` : ''}</div>
  <div class="card"><p class="h2">Progress</p><p class="muted small" style="margin:0 0 10px">${storeKind === 'account' ? '✓ Saved to your Claude account, private to you.' : STANDALONE ? 'Saved on this phone.' : 'Saved in this browser.'}</p><button class="btn ghost" type="button" id="reset">Reset ${esc(lg.name)} progress</button></div>
  <div class="card"><p class="h2">Move progress</p><p class="muted small" style="margin:0 0 10px">Copy a progress code here, then paste it into Yapp on another app or device. It carries every language, star and setting.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn teal" type="button" id="exp">Copy progress code</button><button class="btn ghost" type="button" id="impShow">Paste a code</button></div>
    <div id="impBox" hidden style="margin-top:10px"><textarea class="field" id="impText" rows="3" placeholder="Paste a WB1: code here"></textarea><button class="btn" type="button" id="imp" style="margin-top:8px">Load progress</button></div>
    <textarea class="field" id="expText" rows="3" readonly hidden style="margin-top:10px"></textarea></div>
  <p class="muted small" style="text-align:center">Word lists were written for this app. If something sounds off to a native speaker, trust them.</p>`;
  main.querySelectorAll('.sw').forEach(b => b.onclick = () => { P.settings[b.dataset.k] = !P.settings[b.dataset.k]; dirty(); renderMe(); });
  main.querySelectorAll('[data-goal]').forEach(b => b.onclick = () => { P.goal = +b.dataset.goal; dirty(); renderMe(); });
  $('test')?.addEventListener('click', () => speak(lg.units[0][0].w));
  $('exp').onclick = async () => {
    const bytes = new TextEncoder().encode(JSON.stringify(P)); let bin = ''; for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    const code = 'WB1:' + btoa(bin);
    try { await navigator.clipboard.writeText(code); toast('Progress code copied'); }
    catch (e) { const t = $('expText'); t.hidden = false; t.value = code; t.focus(); t.select(); toast('Select and copy the code below'); }
  };
  $('impShow').onclick = () => { $('impBox').hidden = false; $('impText').focus(); };
  let impArmed = false;
  $('imp').onclick = () => {
    try {
      const raw = $('impText').value.trim(); if (!raw.startsWith('WB1:')) throw new Error();
      const bin = atob(raw.slice(4)), bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const d = JSON.parse(new TextDecoder().decode(bytes)); if (d.v !== 1 || typeof d.langs !== 'object') throw new Error();
      if (!impArmed){ impArmed = true; $('imp').textContent = 'Tap again to replace progress on this device'; return; }
      P = Object.assign({v: 1, cur: null, xp: 0, streak: {last: null, n: 0}, daily: {date: null, n: 0}, goal: 3, settings: {reading: true, sfx: true, auto: true}, langs: {}}, d);
      save(); toast('Progress loaded'); go('path');
    } catch (e) { toast('That code doesn’t look right. Copy it again.'); }
  };
  let armed = false; $('reset').onclick = () => { if (!armed){ armed = true; $('reset').textContent = 'Tap again to erase ' + lg.name + ' progress'; return; } P.langs[P.cur] = {stars: {}, learned: {}, words: {}, custom: LP().custom || []}; dirty(); toast('Progress reset'); renderMe(); };
}

/* ================= Ambient ink petals ================= */
if (!reduced){
  const cv = $('fx'), x = cv.getContext('2d'); let W, H;
  const size = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; }; size(); addEventListener('resize', size);
  const cols = ['210,52,71', '242,181,68', '63,181,166'];
  const ps = Array.from({length: 22}, () => ({x: Math.random() * innerWidth, y: Math.random() * innerHeight, r: Math.random() * 4 + 2, s: Math.random() * .4 + .15, d: Math.random() * 6.28, rot: Math.random() * 6.28, c: pick(cols)}));
  (function loop(){
    if (!document.hidden && !(G && G.kind === 'slash')){
      x.clearRect(0, 0, W, H);
      for (const p of ps){ p.y += p.s; p.x += Math.sin(p.d += .012) * .5; p.rot += .01; if (p.y > H + 10){ p.y = -10; p.x = Math.random() * W; }
        x.save(); x.translate(p.x, p.y); x.rotate(p.rot); x.globalAlpha = .35; x.fillStyle = `rgb(${p.c})`; x.beginPath(); x.ellipse(0, 0, p.r, p.r * .5, 0, 0, 6.283); x.fill(); x.restore(); }
    }
    requestAnimationFrame(loop);
  })();
}

/* ================= Boot ================= */
if (!P.cur){ view = {tab: 'pick', screen: 'pick'}; }
rerender();
initClaude();
addEventListener('pagehide', () => { clearTimeout(saveT); save(); });
document.addEventListener('visibilitychange', () => { if (document.hidden){ clearTimeout(saveT); save(); } });
window.__wb = {P: () => P, G: () => G, units, startGame, go};
})();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) addEventListener('load', () => navigator.serviceWorker.register('sw.js'));</script>
